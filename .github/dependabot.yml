# Dependabot configuration for freshcrab.
#
# Strictness is intentional: every dependency update gets its own PR
# (no grouping — nothing hidden in a group), weekly, and the open-PR
# limit is set high enough that every update gets a PR. One
# exception: github/codeql-action/init and .../analyze are grouped (see
# the github-actions entry below) — CodeQL requires both steps at the
# same version, so separate PRs mix versions and stay red.
# Each PR goes through the same branch protection as any other change
# (green CI + at least 1 approving review); Dependabot PRs are NOT auto-merged.
# The repo is kept green by merging Dependabot PRs promptly, not by
# relaxing the checks — see the "Keeping dependencies fresh" section in
# the README.
#
# Note on the `docker` entry: Dependabot's docker ecosystem only scans
# files named `Dockerfile` (not `Containerfile`), which is why the
# container definition is `Dockerfile`. The base image is
# `registry.opensuse.org/opensuse/tumbleweed:latest` (rolling), so there
# is no versioned tag for Dependabot to bump while it stays on `latest`;
# if the base is ever pinned to a dated snapshot, Dependabot will
# propose the update.

version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # No `groups`: each dependency update is its own PR.
    # Effectively unlimited: every update is surfaced, none suppressed.
    open-pull-requests-limit: 100

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 100
    groups:
      # CodeQL requires init and analyze at the same version: a
      # workflow mixing versions fails outright, so separate PRs for the
      # two steps stay red. Group them into a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
    # dtolnay/rust-toolchain is pinned to a commit on its stable branch
    # (see test.yml); commits on the toolchain branches are
    # garbage-collected upstream, so dependabot skips it. A monthly
    # workflow (.github/workflows/toolchain-pin.yml)
    # nudges a re-pin before the SHA is GC'd.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  # Container base image (Dockerfile).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 100
