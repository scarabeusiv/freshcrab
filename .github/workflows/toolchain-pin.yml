# Monthly re-pin nudge for the dtolnay/rust-toolchain SHA pin.
#
# test.yml and freshness.yml pin dtolnay/rust-toolchain to a commit on
# its stable branch (Dependabot must not move it — see
# dependabot.yml). Commits on the toolchain branches are
# garbage-collected upstream, so a stale pin silently breaks every
# Rust job at once. This workflow runs monthly and fails loudly when
# the pin is gone (GC'd) or older than 45 days, so it is re-pinned
# before it breaks. When it fails, re-pin: take the current stable
# HEAD (`gh api repos/dtolnay/rust-toolchain/commits/stable --jq .sha`)
# and update the SHA in test.yml AND freshness.yml (they must match),
# plus the date in the pin comments.
name: toolchain-pin

on:
  schedule:
    # Monthly, 1st of the month 07:00 UTC.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# Monthly + manual: never run two pin checks at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  toolchain-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the dtolnay pin is live and fresh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The pin must be one SHA everywhere it is used.
          pinned=$(grep -hoP 'dtolnay/rust-toolchain@\K[0-9a-f]{40}' .github/workflows/test.yml .github/workflows/freshness.yml | sort -u)
          count=$(printf '%s\n' "${pinned}" | grep -c .)
          if [ "${count}" -ne 1 ]; then echo "expected one dtolnay pin, found ${count}: ${pinned}" >&2; exit 1; fi
          sha="${pinned}"
          # The pin must still resolve: a GC'd commit 404s here.
          if ! commit_json=$(gh api "repos/dtolnay/rust-toolchain/commits/${sha}"); then
            echo "pinned dtolnay SHA ${sha} no longer resolves (garbage-collected?); re-pin to the current stable HEAD" >&2
            exit 1
          fi
          commit_date=$(printf '%s' "${commit_json}" | jq -r '.commit.committer.date')
          if ! [[ "${commit_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "could not read commit date for ${sha} (got: ${commit_date})" >&2
            exit 1
          fi
          age_days=$(( ( $(date +%s) - $(date -d "${commit_date}" +%s) ) / 86400 ))
          echo "pinned dtolnay SHA ${sha} is ${age_days} days old (committed ${commit_date})"
          if [ "${age_days}" -gt 45 ]; then
            head_sha=$(gh api repos/dtolnay/rust-toolchain/commits/stable --jq '.sha')
            echo "pin is older than 45 days; re-pin test.yml and freshness.yml to the current stable HEAD ${head_sha}" >&2
            exit 1
          fi
