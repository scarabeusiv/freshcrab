---
# Release: build binaries, sign them, create the GitHub release.
#
# Triggered by a `v`-prefixed tag (v0.1.0). The version is the tag minus
# the `v` and must equal [package] version in Cargo.toml, or the run
# fails before building anything. A manual workflow_dispatch run only
# builds (dry-run): artifacts land on the run, no release is created.
# After a release is published, the post-release-bump job opens the
# X.Y.(Z+1) development bump PR.
#
# Signing: when the `GPG_PRIVATE_KEY` secret holds the dedicated signing
# SUBKEY (ASCII-armored; never the primary key), every tarball and the
# checksums file get a detached `.asc` signature. Without the secret the
# release still goes out, unsigned, with a loud warning. The secrets are
# not set in this repo yet, so the first releases will be unsigned.
#
# Toolchain: pinned to 1.99.0, not floating stable — release artifacts
# must be reproducible. The repo's rust-toolchain.toml says `stable`,
# which outranks the rustup default the dtolnay action sets, so the
# build and bump jobs export RUSTUP_TOOLCHAIN to make the pin stick
# (same pattern as the rust-msrv job in test.yml) and assert it.
#
# Pre-release tags: a tag like v0.1.0-rc.1 only passes check-version
# when Cargo.toml carries the identical pre-release version (0.1.0-rc.1);
# with a bare X.Y.Z manifest it fails loudly there. The --prerelease
# branches below are for that manifest-carries-prerelease path, not
# for a bare manifest tagged with a suffix.
#
# Deliberately not here: no benchmark job (freshcrab has no release
# corpus to A/B against); no crates.io publish (registry versions burn
# the version number; re-add once the release cadence is settled);
# no OBS submission; no tag-signature verification (rpmcrab does not
# do it either). Modeled on plusky/rpmcrab's release.yml, adapted for
# a single crate with no system dependencies.
name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0). Dry-run only: no release is created.'
        required: true

permissions:
  contents: read

# Tag pushes are one-shot, but a re-run or a re-pushed tag could race
# another run of the same ref; serialize, never cancel a release
# mid-flight. The recovery logic in the release job handles the
# second run (it leaves a published release alone).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Derive the release version and refuse anything that disagrees with the
  # manifest, so a mistyped tag can never ship the wrong version string.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive and check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            # Strip the leading `v`: v0.1.0 -> 0.1.0.
            version="${GITHUB_REF_NAME#v}"
          fi
          # Scope to the [package] table and anchor at the closing
          # quote, so a `version =` in any earlier table cannot win and a
          # trailing comment cannot leak into the value.
          # A pre-release tag only matches when the manifest carries
          # the identical pre-release version; a bare manifest with a
          # suffixed tag fails here, loudly, by design.
          manifest=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$manifest" || { echo "no [package] version found" >&2; exit 1; }
          if [ "$version" != "$manifest" ]; then
            echo "version $version != manifest version $manifest" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Native arm64 runner: no cross toolchain to maintain.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # rust-toolchain.toml says `stable`, which outranks the rustup
      # default; export the pin so the release is actually built with
      # it, and assert below.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          # Pinned, not floating stable: release artifacts must be
          # reproducible; bump deliberately.
          toolchain: 1.99.0
      - name: Assert pinned toolchain
        run: |
          rustc --version
          rustc --version | grep -F -q "1.99.0"
          # Stronger than the rustc grep alone: proves the pin itself
          # is active, not merely that stable happens to be 1.99.0.
          rustup show active-toolchain
          rustup show active-toolchain | grep -F -q "1.99.0"
      # Releases are built hermetically — no cargo cache, so restored build
      # state can never influence published artifacts.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          target="${{ matrix.target }}"
          stage="dist-$target"
          mkdir -p "$stage"
          cp "target/$target/release/freshcrab" "$stage/"
          cp LICENSE README.md "$stage/"
          out="freshcrab-${version}-${target}.tar.gz"
          tar -czf "$out" -C "$stage" freshcrab LICENSE README.md
          shasum -a 256 "$out" > "$out.sha256"
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    # Tag pushes only: a dispatch run is a dry-run and stops after build.
    if: github.event_name == 'push'
    needs: [check-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Attestation mints the OIDC token for build provenance.
      id-token: write
      attestations: write
    steps:
      # gh release create/upload resolve the repo from git remotes, so the job
      # needs a checkout even though it builds nothing itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          if-no-files-found: error

      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist || exit 1
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Signing is optional: without the secret the release still goes
          # out, unsigned, with a loud warning. The secret must hold only the
          # dedicated signing SUBKEY (ASCII-armored), never the primary key.
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set; publishing unsigned artifacts"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "signing with key: $(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          sign_args=(--batch --yes --pinentry-mode loopback --detach-sign --armor)
          passphrase_input=/dev/null
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            sign_args+=(--passphrase-fd 0)
            passphrase_input=<(printf '%s' "$GPG_PASSPHRASE")
          fi
          cd dist || exit 1
          for f in freshcrab-*.tar.gz SHA256SUMS; do
            gpg "${sign_args[@]}" -o "$f.asc" "$f" <"$passphrase_input"
          done

      # Attest the tarballs' build provenance between download and release, so
      # a provenance failure costs the tag and leaves nothing published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            !dist/*.sha256
            !dist/*.asc

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A non-bare-X.Y.Z tag is a pre-release and never becomes Latest.
          pre=""
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pre="--prerelease --latest=false"
          fi
          # The release stays untitled (version tag only, no name): the
          # notes body is generated first — a read-only API call that
          # creates nothing — and handed to the create calls below as a
          # file. Neither --title nor --generate-notes may reach them:
          # either flag alone titles the release after the tag.
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" --jq '.body // ""' > notes.md
          # Assets ride the create call, not a later upload: gh creates as a
          # draft, uploads, then publishes, which is the only sequence an
          # immutable release accepts (a published release freezes its
          # assets, so create-then-upload 422s). Recovery by leftover kind:
          # a published release with assets is left alone; a draft (with or
          # without assets) is deleted and recreated; a published mutable
          # asset-less leftover is deleted and recreated; a published
          # immutable asset-less release fails loudly — deleting it would
          # retire the tag name without any release to recreate, so the way
          # out is a new version, not a re-run.
          # shellcheck disable=SC2086
          if ! info="$(gh release view "$tag" --json isDraft,isImmutable,assets 2>/dev/null)"; then
            gh release create "$tag" --notes-file notes.md $pre dist/*
          elif [ "$(jq -r .isDraft <<<"$info")" = "false" ] \
            && [ -n "$(jq -r '.assets[].name' <<<"$info")" ]; then
            echo "release $tag already published with assets; leaving it alone"
          elif [ "$(jq -r .isDraft <<<"$info")" = "true" ]; then
            gh release delete "$tag" --yes
            gh release create "$tag" --notes-file notes.md $pre dist/*
          elif [ "$(jq -r .isImmutable <<<"$info")" = "true" ]; then
            echo "::error::release $tag is published, immutable, and has no assets; the tag name is retired and cannot back another release — bump the version and tag again"
            exit 1
          else
            gh release delete "$tag" --yes
            gh release create "$tag" --notes-file notes.md $pre dist/*
          fi

  # Opens the post-release development bump (X.Y.Z -> X.Y.(Z+1)) as a PR
  # with auto-merge on, so main stops carrying the shipped version as
  # soon as the release is out. The PR still needs its human approval,
  # and CI on a bot-opened PR waits for a maintainer's "Approve and run
  # workflows". Lives here rather than in a workflow triggered by the
  # release event, because events the GITHUB_TOKEN creates start no other
  # workflow. A failure leaves the published release as it is: re-running
  # the job updates the same branch and PR.
  post-release-bump:
    if: github.event_name == 'push'
    needs: [check-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      # Same pin as the build job, for the same reason: the lockfile
      # the bump writes must come from the pinned toolchain.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - name: Compute the next development version
        id: next
        env:
          RELEASED: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASED" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "next=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "pre-release $RELEASED: no post-release bump"
          fi
      # No stored token: the build scripts below run third-party code. The
      # push authenticates through gh's credential helper from GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.next.outputs.next
        with:
          ref: main
          persist-credentials: false
      - name: Check main still carries the released version
        id: current
        if: steps.next.outputs.next
        env:
          RELEASED: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$current" || { echo "no [package] version found on main" >&2; exit 1; }
          if [ "$current" = "$RELEASED" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "main already carries $current; nothing to bump"
          fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        if: steps.current.outputs.bump
        with:
          toolchain: 1.99.0
      - name: Bump every version surface
        if: steps.current.outputs.bump
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: bash scripts/bump-version.sh "$NEXT"
      - name: Open the bump PR with auto-merge
        if: steps.current.outputs.bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
          RELEASED: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          branch="release/bump-$NEXT"
          title="chore(release): bump to $NEXT for post-release development"
          # Stage only the version surfaces: the bump script ran
          # third-party build code (cargo), and anything else it touched
          # must fail the job rather than ride along in a version-bump PR.
          git add Cargo.toml Cargo.lock
          stray=$(git status --porcelain | grep -v '^[AMD] ' || true)
          if [ -n "$stray" ]; then
            echo "::error::the bump changed files outside the version surfaces:" >&2
            echo "$stray" >&2
            exit 1
          fi
          # A rerun finds the branch already pushed: it is left as is, so a
          # maintainer's fix on the open bump PR is never overwritten, and
          # the job only makes sure the PR and its auto-merge exist.
          # ls-remote --exit-code: 0 = exists, 2 = absent, anything else is
          # a real failure that must not read as "absent".
          rc=0
          git ls-remote --exit-code --heads origin "$branch" >/dev/null || rc=$?
          case "$rc" in
            0) echo "$branch already exists; leaving it as is" ;;
            2)
              git -c user.name=github-actions -c user.email=github-actions@github.com \
                checkout -b "$branch"
              git -c user.name=github-actions -c user.email=github-actions@github.com \
                commit -m "$title"
              git push -u origin "$branch"
              ;;
            *) echo "::error::git ls-remote failed ($rc)" >&2; exit 1 ;;
          esac
          body="v$RELEASED is out; main moves to $NEXT for post-release development. Opened by the release workflow."
          # --head matches fork PRs by branch name too: only this repo's
          # own branch may receive auto-merge.
          pr=$(gh pr list --head "$branch" --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$branch" --title "$title" --body "$body")
          fi
          gh pr merge "$pr" --auto --rebase
