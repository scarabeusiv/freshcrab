name: assets-drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run of the same workflow on the same ref, but only
# for pull requests: a push to main must never cancel a running main
# build. Matches test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The man pages and shell completions are checked in under
  # {man,completions}; regenerate them from the clap Command and fail if
  # the committed assets drifted. Matches geectl's assets-drift job.
  assets-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to the v7.0.1 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is derived from Cargo.toml `rust-version` (the single
      # source of truth). Same extraction as the rust-msrv job in test.yml
      # and the build job in release.yml; rust-toolchain.toml says `stable`,
      # which outranks the rustup default the dtolnay action sets, so the
      # derived version is exported as RUSTUP_TOOLCHAIN to make it stick.
      - name: Derive the toolchain from Cargo.toml
        id: toolchain
        run: |
          toolchain=$(sed -n 's/^rust-version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$toolchain" || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          # The Test and lint step below runs clippy: install it here,
          # like the test jobs do. Without it the toolchain has no
          # cargo-clippy and the lint step fails.
          components: clippy
      # Pinned to the v2.9.3 tag's commit; Dependabot tracks SHA pins and
      # proposes updates. Plain cache (no OS-release scoping): freshcrab
      # is pure Rust with no bindgen or system libraries, so the cache
      # is not tied to a distro release the way rpmcrab's is.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      # The generator tests only exist behind `--features gen`, and no
      # other job enables it: run them here, and lint the bin, so the
      # generator stays covered in CI.
      - name: Test and lint the generator
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --locked --features gen --bin freshcrab-gen
          cargo clippy --all-targets --locked --features gen -- -D warnings
      # Regenerate into a scratch directory and fail if the committed
      # assets differ: a clap change must regenerate man/ and
      # completions/ in the same PR. Regenerate locally with
      # `cargo run --features gen --bin freshcrab-gen` and commit the result.
      - name: Regenerate man pages and completions
        env:
          RUSTFLAGS: -D warnings
        run: cargo run --locked --features gen --bin freshcrab-gen -- /tmp/freshcrab-gen-assets
      - name: Fail on drift
        run: |
          diff -r man /tmp/freshcrab-gen-assets/man
          diff -r completions /tmp/freshcrab-gen-assets/completions
