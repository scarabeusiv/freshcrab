---
name: dependency-review
on:
  pull_request:

# PR-only: cancel a superseded run of the same workflow on the same
# ref, like test.yml does for pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # comment-summary-in-pr posts the review summary as a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The project is Apache-2.0; deny licences that cannot be
          # linked into it. The allow-list in deny.toml is the
          # compile-time floor; this guards the PR-time graph.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.0-only, LGPL-2.1-only, LGPL-3.0-only, LGPL-2.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later, SSPL-1.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          # rust-cache is a CI-only action; its licence (LGPL-3.0-only
          # — plain LGPL-3.0 text, no "or later" grant, verified
          # against the repo's LICENSE) does not affect the Apache-2.0
          # project, so exclude it from license checks. NOTE: this
          # input takes bare PURLs only — the action (v5.0.0) splits
          # on commas and parses each entry as a PURL, so a
          # `purl, SPDX` qualifier fails config parsing (proven by
          # the CI failure on the qualified form). The allow is
          # therefore per-package, not per-licence; that is accepted
          # because the action is CI-only and never linked.
          allow-dependencies-licenses: 'pkg:githubactions/Swatinem/rust-cache'
