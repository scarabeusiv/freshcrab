# Bump the opensuse-packaging-skill tag in the Dockerfile.
#
# Dependabot's docker ecosystem only tracks FROM image tags, not a
# git-clone branch (verified against dependabot-core's docker file
# parser, which only matches ^FROM lines), so it cannot bump the skill
# tag. This workflow does the equivalent job: weekly, it checks the
# latest tagged release of openSUSE/openSUSE-packaging-skill and, when
# a new tag exists, opens a PR updating the tag (and the pinned commit
# SHA, which the Dockerfile build verifies the clone against) in the
# Dockerfile and the docs that name it. The PR goes through the same CI
# + review gate as any other change.
name: Bump opensuse-packaging-skill tag

on:
  schedule:
    # Weekly, Monday 07:00 UTC — same cadence as the Dependabot runs.
    - cron: '0 7 * * MON'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time; a superseded run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check latest skill tag
        id: check
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/openSUSE/openSUSE-packaging-skill/tags --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          current=$(grep -oP '^ARG PACKAGING_SKILL_TAG=\K.*' Dockerfile)
          # Fail loudly when either side is empty: an empty latest (a
          # failed tag listing) would otherwise compare unequal to the
          # current tag and open a PR that deletes the tag everywhere.
          if [ -z "${latest}" ]; then echo "could not determine latest skill tag" >&2; exit 1; fi
          if [ -z "${current}" ]; then echo "could not determine current skill tag" >&2; exit 1; fi
          # Resolve the commit the new tag points to (peeling an
          # annotated tag): the Dockerfile pins the SHA alongside the
          # tag, and the build verifies the clone matches it.
          ref_json=$(gh api "repos/openSUSE/openSUSE-packaging-skill/git/refs/tags/${latest}")
          tag_sha=$(printf '%s' "${ref_json}" | jq -r '.object.sha')
          tag_type=$(printf '%s' "${ref_json}" | jq -r '.object.type')
          # The tag object must be a 40-hex SHA: a failed `gh api` call
          # (or a JSON error body) makes `jq -r` print the literal
          # string "null", which an empty check would pass.
          if ! [[ "${tag_sha}" =~ ^[0-9a-f]{40}$ ]]; then echo "could not determine tag object for ${latest} (got: ${tag_sha})" >&2; exit 1; fi
          if [ "${tag_type}" = "tag" ]; then
            sha=$(gh api "repos/openSUSE/openSUSE-packaging-skill/git/tags/${tag_sha}" --jq '.object.sha')
          else
            sha="${tag_sha}"
          fi
          # The SHA must be a 40-hex commit: without this, a "null"
          # from `jq -r` would be written to GITHUB_OUTPUT and the
          # workflow would open a PR pinning SHA=null.
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then echo "could not determine commit for tag ${latest} (got: ${sha})" >&2; exit 1; fi
          {
            echo "latest=${latest}"
            echo "current=${current}"
            echo "sha=${sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "latest tag: ${latest} (${sha}), current tag: ${current}"

      - name: Open PR for new tag
        if: steps.check.outputs.latest != steps.check.outputs.current
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="${{ steps.check.outputs.latest }}"
          current="${{ steps.check.outputs.current }}"
          sha="${{ steps.check.outputs.sha }}"
          # Re-validate the SHA the check step resolved: never pin a
          # non-commit value into the Dockerfile.
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then echo "refusing to pin non-SHA value: ${sha}" >&2; exit 1; fi
          branch="skill-tag-bump/${latest}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          # Anchor the replacements: the Dockerfile ARG lines only (not
          # every occurrence of the tag), and the "tag <version>" mention
          # in the docs (not arbitrary occurrences).
          current_esc=$(printf '%s' "${current}" | sed 's/[.[\*^$]/\\&/g')
          sed -i "s/^ARG PACKAGING_SKILL_TAG=${current_esc}$/ARG PACKAGING_SKILL_TAG=${latest}/" Dockerfile
          sed -i "s/^ARG PACKAGING_SKILL_SHA=[0-9a-f]*$/ARG PACKAGING_SKILL_SHA=${sha}/" Dockerfile
          # Scope the docs replacements to the two live tag mentions
          # (the "tag <version> of openSUSE/openSUSE-packaging-skill"
          # phrase and the "(fetched at build time, tag <version>)"
          # phrase): a global `s/tag X/tag Y/g` would also rewrite other
          # mentions of the current tag.
          sed -i "s|tag ${current_esc} of openSUSE/openSUSE-packaging-skill|tag ${latest} of openSUSE/openSUSE-packaging-skill|g" README.md docs/runbook.md
          sed -i "s|(fetched at build time, tag ${current_esc})|(fetched at build time, tag ${latest})|" docs/runbook.md
          grep -q "^ARG PACKAGING_SKILL_TAG=${latest}$" Dockerfile || { echo "tag update failed" >&2; exit 1; }
          grep -q "^ARG PACKAGING_SKILL_SHA=${sha}$" Dockerfile || { echo "SHA update failed" >&2; exit 1; }
          grep -F -q "tag ${latest} of openSUSE/openSUSE-packaging-skill" README.md || { echo "README tag update failed" >&2; exit 1; }
          grep -F -q "tag ${latest} of openSUSE/openSUSE-packaging-skill" docs/runbook.md || { echo "runbook tag update failed" >&2; exit 1; }
          grep -F -q "(fetched at build time, tag ${latest})" docs/runbook.md || { echo "runbook skill-phrase update failed" >&2; exit 1; }
          git add Dockerfile README.md docs/runbook.md
          git commit -m "chore: bump opensuse-packaging-skill to ${latest}"
          git push origin "${branch}"
          gh pr create --base main --title "chore: bump opensuse-packaging-skill to ${latest}" --body "New tagged release ${latest} of openSUSE/openSUSE-packaging-skill."
