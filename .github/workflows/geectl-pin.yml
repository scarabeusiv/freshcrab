# Monthly re-pin nudge for the geectl rev pin.
#
# Cargo.toml pins geectl to a reviewed rev (bda5911, the v0.1.0 tag),
# not to the tag: a tag is mutable, so a tag pin would let a routine
# `cargo update -p geectl` silently advance the dependency. A rev pin
# cannot move on its own — but it also cannot signal that a newer
# geectl release exists. This workflow runs monthly and fails loudly
# when a newer geectl tag exists, so the pin is bumped in a reviewed
# PR (change the rev in Cargo.toml, the tag in the Cargo.toml comment
# and the deny.toml comment, then `cargo update -p geectl`). When it
# fails, bump: take the newest bare semver tag's SHA (see the tag
# selection below) and update the rev pin.
name: geectl-pin

on:
  schedule:
    # Monthly, 1st of the month 07:30 UTC.
    - cron: "30 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# Monthly + manual: never run two pin checks at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geectl-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the geectl rev pin is live and current
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The pin is one rev in Cargo.toml.
          pinned=$(sed -n 's/.*geectl.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)
          count=$(printf '%s\n' "${pinned}" | grep -c .)
          if [ "${count}" -ne 1 ]; then echo "expected one geectl rev pin, found ${count}: ${pinned}" >&2; exit 1; fi
          # The pinned rev must still resolve upstream.
          if ! commit_json=$(gh api "repos/scarabeusiv/geectl/commits/${pinned}"); then
            echo "pinned geectl rev ${pinned} no longer resolves; re-pin to the newest tag" >&2
            exit 1
          fi
          commit_date=$(printf '%s' "${commit_json}" | jq -r '.commit.committer.date')
          if ! [[ "${commit_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "could not read commit date for ${pinned} (got: ${commit_date})" >&2
            exit 1
          fi
          echo "pinned geectl rev ${pinned} (committed ${commit_date})"
          # The newest geectl release tag must be the pinned one: a
          # newer tag means a newer release exists to bump to. The
          # tags endpoint does not order contractually, so fetch a
          # full page and pick the newest bare semver tag
          # (vMAJOR.MINOR.PATCH, no prereleases) by version sort
          # instead of trusting the first entry.
          tags_json=$(gh api "repos/scarabeusiv/geectl/tags?per_page=100")
          latest_tag=$(printf '%s' "${tags_json}" | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "${latest_tag}" ]; then
            echo "no bare semver geectl tag found" >&2
            exit 1
          fi
          latest_sha=$(printf '%s' "${tags_json}" | jq -r --arg tag "${latest_tag}" '.[] | select(.name == $tag) | .commit.sha')
          if [ -z "${latest_sha}" ]; then
            echo "could not read commit sha for geectl tag ${latest_tag}" >&2
            exit 1
          fi
          if [ "${latest_sha}" != "${pinned}" ]; then
            echo "geectl has a newer release ${latest_tag} (${latest_sha}); bump the rev pin in Cargo.toml (and the tag in its comment) in a reviewed PR" >&2
            exit 1
          fi
          echo "geectl pin is current at ${latest_tag}"
