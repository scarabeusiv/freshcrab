# The toolchain is pinned here, not in the workflows: the dtolnay
# action reads this file, and local `cargo` does too, so CI and
# developers use the same compiler. Track stable; the MSRV is declared
# once in the root Cargo.toml (`rust-version`) and enforced by a
# dedicated CI job.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
