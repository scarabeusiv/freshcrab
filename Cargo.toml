[package]
name = "freshcrab"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Automatic updater and validator for openSUSE Tumbleweed/Factory"
license = "Apache-2.0"
repository = "https://github.com/scarabeusiv/freshcrab"

[lib]
name = "freshcrab"
path = "src/lib.rs"

[[bin]]
name = "freshcrab"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS backend pinned explicitly: default features off, rustls on,
# so the transport cannot silently change if ureq's defaults move.
# gzip stays on (it was a default) so compressed collector responses
# keep working.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# File locking for the queue (flock): serializes concurrent writers.
fs2 = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is informative locally; CI uses -D warnings on the default set only
# (do not enable pedantic as warn-as-error — it blocks scaffolding with style
# nits).
pedantic = { level = "allow", priority = -1 }
