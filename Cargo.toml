[package]
name = "freshcrab"
version = "0.1.1"
edition = "2021"
# Inherited from the geectl dependency: cargo enforces a dependency's
# rust-version, so the MSRV job would fail on anything below geectl's
# 1.99.1.
rust-version = "1.99.1"
description = "Automatic updater and validator for openSUSE Tumbleweed/Factory"
license = "Apache-2.0"
repository = "https://github.com/scarabeusiv/freshcrab"

[lib]
name = "freshcrab"
path = "src/lib.rs"

[[bin]]
name = "freshcrab"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS backend pinned explicitly: default features off, rustls on,
# so the transport stays fixed if ureq's defaults move.
# gzip stays on so compressed collector responses keep working.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# File locking for the queue (flock): serializes concurrent writers.
fs2 = "0.4"
# Base64 for the HTTP Basic auth header.
base64 = "0.23"
# The OBS library: the Factory reads, the devel lookup, the open-SR
# check, and SR filing all come from geectl. Taken from crates.io
# (0.2.3); Dependabot's weekly cargo updates propose each new geectl
# release as its own PR — bump by changing the version in a reviewed PR.
geectl = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is informative locally; CI uses -D warnings on the default set only
# (pedantic stays allow: as warn-as-error it blocks scaffolding with style
# nits).
pedantic = { level = "allow", priority = -1 }
