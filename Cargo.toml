[package]
name = "freshcrab"
version = "0.1.0"
edition = "2021"
# Inherited from the geectl dependency: cargo enforces a dependency's
# rust-version, so the MSRV job would fail on anything below geectl's
# 1.99.1.
rust-version = "1.99.1"
description = "Automatic updater and validator for openSUSE Tumbleweed/Factory"
license = "Apache-2.0"
repository = "https://github.com/scarabeusiv/freshcrab"

[lib]
name = "freshcrab"
path = "src/lib.rs"

[[bin]]
name = "freshcrab"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS backend pinned explicitly: default features off, rustls on,
# so the transport cannot silently change if ureq's defaults move.
# gzip stays on (it was a default) so compressed collector responses
# keep working.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# File locking for the queue (flock): serializes concurrent writers.
fs2 = "0.4"
# Base64 for the HTTP Basic auth header. Already a transitive
# dependency via ureq (same version), so this adds no new crate.
base64 = "0.23"
# The OBS library: the devel lookup, the open-SR check, and SR filing
# all come from geectl now; the local OBS client is deleted. Pinned to
# the reviewed main revision (staging step 3 of the geectl migration).
geectl = { git = "https://github.com/scarabeusiv/geectl", rev = "d415c11ef9d10ce673b6d3f10bf34a0f9a21d862" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is informative locally; CI uses -D warnings on the default set only
# (do not enable pedantic as warn-as-error — it blocks scaffolding with style
# nits).
pedantic = { level = "allow", priority = -1 }
