# freshcrab configuration.
#
# Broad defaults: watch all Factory packages except the exclusions.
# A package is watched unless it is listed in `exclusions`.
# To watch only a specific set, list packages under `packages` (empty
# means: all of Factory except the exclusions).

# Distributions to watch. Only `factory` is implemented. A Leap target
# (e.g. `leap-16.0`) parses but the pipeline refuses to run it until
# the Leap step lands — see docs/leap-and-cve.md. Do not add a Leap
# target here until that step is done.
targets:
  - factory

# Packages to monitor. Empty = all of Factory except the exclusions.
packages:

# Packages that are never auto-updated (hand-maintained or special).
exclusions:
  - gcc
  - qemu
  - kernel
  - glibc
  - systemd
  - rpm
  - python3
  - perl

# How many workers run at once (the dispatcher takes at most this many
# queued entries per run).
concurrency: 4

# Maximum submit requests filed per day (the dispatcher stops when
# this many SRs were filed today).
daily_sr_cap: 20

# Kill switch: when true, the pipeline pauses entirely.
kill_switch: false

# Report-only mode: queue and report what would be updated; file nothing.
report_only: true

# Dry-run mode: when true, nothing is written or filed anywhere — the
# watcher, queue, dispatcher and worker only print what they WOULD do.
# Default true in this phase. Overridable by --dry-run / --live on the
# command line and by the FRESHCRAB_DRY_RUN env var.
dry_run: true

# The OBS home project the worker branches into (e.g.
# home:scarabeus_iv). Empty means: derive it from the OBS username
# (home:{OSC_USERNAME}). The worker needs a branch project to build an
# SR payload; without one, live filing escalates and dry-run planning
# notes the gap. Set this (or OSC_USERNAME) before running with
# report_only: false.
home_project: ""

# The review-queue stages (steps 5-7 of issue #21). Each stage is
# off by default and starts only on an explicit go-ahead, in order:
# comment-only first, then request-changes, then trivial-fix
# accept. A later stage refuses to run while an earlier one is
# off. The kill switch pauses every stage.
review_comment_stage: false
review_request_changes_stage: false
review_accept_stage: false

